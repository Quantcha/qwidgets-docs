title: Qwidgets Docs
description: How to use Qwidgets to plan, track, and manage your investments.
url: https://docs.qwidgets.com
baseurl: ""

# Every link into the app uses {{ site.app_url }}. The www.qwidgets.com cutover is this one line.
app_url: https://predictions.qwidgets.com

remote_theme: just-the-docs/just-the-docs@v0.12.0

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

color_scheme: qwidgets
logo: /assets/images/brand/logo.png
favicon_ico: /assets/images/brand/favicon.ico

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true
back_to_top: true
back_to_top_text: Back to top

mermaid:
  version: "11.4.1"

callouts_level: loud
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: yellow
  warning:
    title: Warning
    color: red

nav_external_links: []

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .vs
