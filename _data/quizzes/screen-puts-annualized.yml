question: "Ranked by annualized return, the top secured puts are mostly on very volatile underlyings. Why?"
choices:
  - text: "Higher implied volatility means larger premiums, because the market expects larger moves."
    correct: true
    explanation: "Premium is the price of carrying the risk of a move. The underlyings that pay the most are the ones the market thinks are most likely to move sharply."
  - text: "The screener favors them because they're better trades."
    correct: false
    explanation: "The ranking sorts by the return you'd collect, not by how good a trade is. A higher return here usually comes with a larger chance of being assigned on shares that have fallen."
  - text: "Volatile underlyings are less likely to be assigned."
    correct: false
    explanation: "It's the reverse. A volatile underlying is more likely to fall below the strike, which is part of why its puts pay more."
  - text: "The delay in the data makes volatile underlyings look better than they are."
    correct: false
    explanation: "The delay affects every result the same way. The pattern comes from how options are priced, not from the feed."
